<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FS · Supabase beta</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0c1117;color:#f4f7fb;font:15px system-ui}main{max-width:1100px;margin:auto;padding:25px}.muted{color:#94a3b8}.card{background:#151c25;border:1px solid #2b3746;border-radius:16px;padding:18px;margin:12px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.cards .card{margin:0}b.big{display:block;font-size:27px;margin-top:10px;color:#78e08f}input,button{padding:12px;border-radius:10px;border:1px solid #425166;background:#1a2430;color:white;margin:4px}button{cursor:pointer}button.active{background:#78e08f;color:#0c1117}table{width:100%;border-collapse:collapse}th,td{padding:10px;text-align:left;border-bottom:1px solid #2b3746}section[hidden],div[hidden]{display:none}nav{margin:20px 0}h1{font-size:30px}#message{white-space:pre-wrap;color:#ffc857}canvas{max-height:300px}a{color:#78e08f}</style></head><body><main><h1>FS <small class="muted">Supabase beta</small></h1><p class="muted">Личный дневник · защищённые запросы · без data.json</p><div id="login" class="card"><h2>Вход</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Пароль"><button id="enter">Войти</button><button id="link">Ссылка на почту</button></div><div id="app" hidden><p><span id="who"></span> · <button id="logout">Выйти</button></p><nav><button data-tab="today" class="active">Сегодня</button><button data-tab="progress">Прогресс</button><button data-tab="training">Тренировки</button></nav><section id="today"><h2 id="date"></h2><div class="cards" id="metrics"></div><div class="card"><h3>Питание</h3><div id="food"></div></div></section><section id="progress" hidden><h2>Прогресс</h2><div class="card"><canvas id="calories"></canvas></div><div class="card"><canvas id="weight"></canvas></div><div class="card"><h3>Замеры</h3><div id="measurements"></div></div></section><section id="training" hidden><h2>Тренировки</h2><div class="card" id="sets"></div></section></div><p id="message" role="status"></p><p class="muted">Тестовая версия. Основной FS не изменён. <a href="./">Открыть старый сайт</a></p></main><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4"></script><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';const db=createClient('https://gnzemzchpxitmsjfwnzp.supabase.co','sb_publishable_7MTbgbpshUnUMqBu7j46IA_5PDelDLO',{db:{schema:'fitness'}}),$=id=>document.getElementById(id),say=s=>$('message').textContent=s,fmt=v=>v==null?'—':Number(v).toLocaleString('ru-RU',{maximumFractionDigits:1}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let charts=[];async function rows(table,order='day',limit=1000){const{data,error}=await db.from(table).select('*').order(order,{ascending:false}).limit(limit);if(error)throw new Error(table+': '+error.message);return data}function chart(id,labels,values,label){const c=new Chart($(id),{type:'line',data:{labels,datasets:[{label,data:values,borderColor:'#78e08f',tension:.2,spanGaps:true}]},options:{responsive:true,maintainAspectRatio:false}});charts.push(c)}async function load(){say('Загрузка данных…');try{const[d,f,w,m]=await Promise.all([rows('daily_summaries'),rows('food_logs','occurred_at'),rows('workout_sets','occurred_at'),rows('measurements')]);const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Moscow',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()),day=d.find(x=>x.day===today);$('date').textContent='Сегодня · '+today;$('metrics').innerHTML=[['Калории',day?.kcal,'ккал'],['Белок',day?.protein_g,'г'],['Жиры',day?.fat_g,'г'],['Углеводы',day?.carbs_g,'г'],['Вес',(day?.weight_kg??d.find(x=>x.weight_kg!=null)?.weight_kg),'кг']].map(([name,val,unit])=>'<div class="card">'+name+'<b class="big">'+fmt(val)+'</b><span class="muted">'+unit+'</span></div>').join('');const foods=f.filter(x=>x.day===today);$('food').innerHTML=foods.length?'<div style="overflow-x:auto"><table><thead><tr><th>Приём</th><th>Состав</th><th>Ккал</th><th>Б</th><th>Ж</th><th>У</th></tr></thead><tbody>'+foods.map(x=>'<tr><td>'+esc(x.display_name||x.meal_type||'Приём пищи')+'</td><td>'+esc(x.original_text||'—')+'</td><td>'+fmt(x.kcal)+'</td><td>'+fmt(x.protein_g)+'</td><td>'+fmt(x.fat_g)+'</td><td>'+fmt(x.carbs_g)+'</td></tr>').join('')+'</tbody></table></div><p class="muted">Прочерки означают, что КБЖУ отдельных приёмов пищи ещё не перенесены. Итог дня отображается отдельно.</p>':'За сегодня записей пока нет';charts.forEach(x=>x.destroy());charts=[];const ordered=[...d].reverse();chart('calories',ordered.map(x=>x.day),ordered.map(x=>x.kcal),'Калории');chart('weight',ordered.map(x=>x.day),ordered.map(x=>x.weight_kg),'Вес');$('measurements').innerHTML=m.map(x=>'<p>'+esc(x.day)+': талия '+fmt(x.waist_cm)+' см, грудь '+fmt(x.chest_cm)+' см, бицепс '+fmt(x.biceps_cm)+' см</p>').join('')||'Нет замеров';$('sets').innerHTML='<p>Всего подходов: '+w.length+'</p>'+w.slice(0,80).map(x=>'<p>'+esc(x.day)+' · '+esc(x.exercise)+' · '+fmt(x.weight_kg)+' кг × '+fmt(x.reps)+' · RIR '+fmt(x.rir)+'</p>').join('');say('Загружено: '+d.length+' дней, '+f.length+' записей питания, '+w.length+' подходов, '+m.length+' замеров.')}catch(e){say('Ошибка: '+e.message)}}async function refresh(){const{data:{user}}=await db.auth.getUser();$('login').hidden=!!user;$('app').hidden=!user;$('who').textContent=user?.email||'';if(user)await load()}$('enter').onclick=async()=>{const{error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)say(error.message);else await refresh()};$('link').onclick=async()=>{const{error}=await db.auth.signInWithOtp({email:$('email').value.trim(),options:{shouldCreateUser:false,emailRedirectTo:location.href.split('#')[0]}});say(error?error.message:'Проверь почту')};$('logout').onclick=async()=>{await db.auth.signOut();charts.forEach(x=>x.destroy());charts=[];await refresh()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['today','progress','training'].forEach(id=>$(id).hidden=id!==b.dataset.tab)});db.auth.onAuthStateChange(()=>setTimeout(refresh,0));refresh();</script></body></html>
