<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FS — вход</title><style>body{font:16px system-ui;max-width:480px;margin:10vh auto;padding:20px;background:#101820;color:#f3f6f9}input,button{display:block;width:100%;box-sizing:border-box;padding:14px;margin:10px 0;border-radius:9px;border:1px solid #657080}input{background:#1e2a35;color:white}button{background:#b0e8bf;color:#101820;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>FS — проверка входа</h1><p>Тестовая страница. Основной дневник не изменён.</p><div id="login"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Пароль"><button id="enter">Войти с паролем</button><button id="link">Получить ссылку на почту</button></div><div id="private" hidden><p>Вы вошли как <span id="who"></span></p><button id="check">Проверить последние записи</button><button id="exit">Выйти</button></div><pre id="status"></pre><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';const sb=createClient('https://gnzemzchpxitmsjfwnzp.supabase.co','sb_publishable_7MTbgbpshUnUMqBu7j46IA_5PDelDLO',{db:{schema:'fitness'}});const el=id=>document.getElementById(id),say=s=>el('status').textContent=s;async function refresh(){const{data:{user}}=await sb.auth.getUser();el('login').hidden=!!user;el('private').hidden=!user;el('who').textContent=user?.email||''}el('enter').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});say(error?error.message:'Вход выполнен');await refresh()};el('link').onclick=async()=>{const{error}=await sb.auth.signInWithOtp({email:el('email').value.trim(),options:{shouldCreateUser:false,emailRedirectTo:location.href.split('#')[0]}});say(error?error.message:'Проверь почту')};el('check').onclick=async()=>{const{data,error}=await sb.from('daily_summaries').select('day,kcal,protein_g').order('day',{ascending:false}).limit(3);say(error?error.message:JSON.stringify(data,null,2))};el('exit').onclick=async()=>{await sb.auth.signOut();await refresh()};sb.auth.onAuthStateChange(()=>setTimeout(refresh,0));refresh();</script></html>
